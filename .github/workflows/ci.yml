name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NEXT_PUBLIC_SERVER_URL: http://localhost:7777
  VITE_API_BASE_URL: http://localhost:7777/api

jobs:
  quality:
    name: ${{ matrix.workspace }} - lint / typecheck / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - client
          - admin
          - server
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

  unit-tests:
    name: Server unit tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    env:
      NODE_ENV: test
      MONGO_URI: mongodb://127.0.0.1:27017/ez-shop
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret
      GOOGLE_CALLBACK_URL: http://localhost:7777/api/auth/google/callback
      CLIENT_URL: http://localhost:5173
      ADMIN_URL: http://localhost:3000
      R2_ACCOUNT_ID: ci-account-id
      R2_ACCESS_KEY_ID: ci-access-key-id
      R2_SECRET_ACCESS_KEY: ci-secret-access-key
      R2_BUCKET: ez-shop-ci
      R2_PUBLIC_URL: https://cdn.example.com
      RESEND_API_KEY: re_ci_placeholder
      EMAIL_FROM: ci@example.com
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_WEBHOOK_SECRET: whsec_ci
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test

  e2e:
    name: Playwright
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/ez-shop
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret
      GOOGLE_CALLBACK_URL: http://localhost:7777/api/auth/google/callback
      CLIENT_URL: http://localhost:5173
      ADMIN_URL: http://localhost:3000
      R2_ACCOUNT_ID: ci-account-id
      R2_ACCESS_KEY_ID: ci-access-key-id
      R2_SECRET_ACCESS_KEY: ci-secret-access-key
      R2_BUCKET: ez-shop-ci
      R2_PUBLIC_URL: https://cdn.example.com
      RESEND_API_KEY: re_ci_placeholder
      EMAIL_FROM: ci@example.com
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_WEBHOOK_SECRET: whsec_ci
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install dependencies
        run: |
          for workspace in server client admin e2e; do
            (cd "$workspace" && bun install --frozen-lockfile)
          done

      - name: Install Playwright Chromium
        working-directory: e2e
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: e2e
        # Serial execution keeps the storefront project ahead of the admin
        # project, whose product fixture would otherwise leak into catalog
        # tests while they are running.
        run: bun run test --workers=1

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

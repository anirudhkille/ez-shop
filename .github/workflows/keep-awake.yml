name: keep-awake

on:
  schedule:
    # 9:00 AM - 2:00 PM IST (03:30 - 08:30 UTC), every 10 minutes
    - cron: "30,40,50 3 * * *"
    - cron: "*/10 4-7 * * *"
    - cron: "0,10,20,30 8 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping ezshop
        run: curl -fsS --max-time 90 --retry 2 --retry-delay 10 https://ez-shop-server.onrender.com/api/health